name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the packed package starts
        run: |
          npm pack
          mkdir -p /tmp/pack-test && cd /tmp/pack-test
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/puppygraph-mcp-server-*.tgz
          # The server must start and answer an MCP initialize request on stdio,
          # even with no PuppyGraph running, and exit when stdin closes.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 20 npx --no-install puppygraph-mcp > out.json
          cat out.json
          grep -q '"serverInfo":{"name":"puppygraph"' out.json
